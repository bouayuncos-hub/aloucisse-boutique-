<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Administration — Alou Cissé</title>
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#111111">
<style>
:root{--bg:#f5f5f7;--surface:#fff;--surface2:#fafafa;--text:#1d1d1f;--muted:#6e6e73;--line:#e3e3e8;--ink:#111;--ink-text:#fff;--gold:#c8961e;--gold-soft:#fbf3df;--ok:#18864b;--ok-soft:#e5f5ec;--warn:#b26a00;--warn-soft:#fff3e0;--danger:#d92d20;--danger-soft:#fdecea;--r:14px;--font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#000;--surface:#141416;--surface2:#1c1c1f;--text:#f5f5f7;--muted:#a1a1a6;--line:#2c2c30;--ink:#f5f5f7;--ink-text:#000;--gold:#e5b443;--gold-soft:#2a2210;--ok:#3ccf7f;--ok-soft:#10261a;--warn:#ffb340;--warn-soft:#2b1f0b;--danger:#ff6961;--danger-soft:#2d1312;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 var(--font);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
.wrap{max-width:1200px;margin:0 auto;padding:0 16px}
header{position:sticky;top:0;z-index:10;background:var(--surface);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;gap:12px;min-height:58px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:8px;font-weight:700}
.logo b{display:grid;place-items:center;width:30px;height:30px;border-radius:8px;background:var(--ink);color:var(--gold);font-size:.8rem}
.tabs{display:flex;gap:4px;overflow-x:auto;flex:1}
@media(max-width:760px){.tabs{order:3;flex-basis:100%;padding-bottom:8px}header .wrap{gap:8px;padding-top:8px}}
.tabs button{border:0;background:none;padding:8px 12px;border-radius:999px;cursor:pointer;color:var(--muted);white-space:nowrap}
.tabs button.on{background:var(--ink);color:var(--ink-text)}
.cnt{display:inline-block;min-width:18px;padding:0 5px;border-radius:999px;background:var(--gold);color:#000;font-size:.7rem;font-weight:700;margin-left:4px;text-align:center}
main{padding:18px 0 60px}
h1{font-size:1.5rem;margin:0 0 14px;letter-spacing:-.01em}
h2{font-size:1.05rem;margin:0 0 10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:40px;padding:0 16px;border-radius:999px;border:0;background:var(--ink);color:var(--ink-text);font-weight:600;cursor:pointer;white-space:nowrap}
.btn.ghost{background:var(--surface);color:var(--text);border:1px solid var(--line)}
.btn.gold{background:var(--gold);color:#000}.btn.ok{background:var(--ok);color:#fff}.btn.bad{background:var(--danger);color:#fff}
.btn.sm{height:32px;padding:0 12px;font-size:.85rem}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.box{background:var(--surface);border-radius:var(--r);padding:16px;border:1px solid var(--line);margin-bottom:14px}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:14px}
@media(min-width:800px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.kpi span{font-size:.8rem;color:var(--muted)}.kpi b{display:block;font-size:1.35rem;letter-spacing:-.02em;margin-top:2px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.in{height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:0 10px;width:100%}
.bar .in{width:auto;flex:1;min-width:160px}
textarea.in{height:auto;padding:8px 10px;min-height:80px;resize:vertical}
label.f{display:block;font-size:.8rem;font-weight:600;margin:10px 0 4px}
.g2{display:grid;gap:0 12px}@media(min-width:600px){.g2{grid-template-columns:1fr 1fr}}
.g3{display:grid;gap:0 12px}@media(min-width:600px){.g3{grid-template-columns:1fr 1fr 1fr}}
.list{display:grid;gap:8px}
.ord{display:grid;grid-template-columns:1fr auto;gap:4px 12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;cursor:pointer;text-align:left;width:100%}
.ord:hover{border-color:var(--gold)}
.ord .c{font:600 .9rem ui-monospace,Menlo,Consolas,monospace}
.ord .m{font-size:.82rem;color:var(--muted)}
.ord .r{text-align:right}
.pill{display:inline-block;font-size:.72rem;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}.pill.bad{background:var(--danger-soft);color:var(--danger);border-color:transparent}.pill.gold{background:var(--gold-soft);color:var(--gold);border-color:transparent}
.prod{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.prod img{width:56px;height:56px;border-radius:10px;object-fit:cover;background:var(--surface2)}
.prod .n{font-weight:600;font-size:.92rem;line-height:1.3}
.stock{display:flex;align-items:center;gap:4px}
.stock input{width:64px;height:34px;text-align:center;border-radius:8px;border:1px solid var(--line);background:var(--surface)}
.stock input.low{border-color:var(--warn);color:var(--warn);font-weight:700}
.stock input.out{border-color:var(--danger);color:var(--danger);font-weight:700}
dialog{border:0;border-radius:18px;padding:0;width:min(720px,96vw);max-height:92vh;background:var(--bg);color:var(--text)}
dialog::backdrop{background:rgba(0,0,0,.5)}
.dh{position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;z-index:1}
.db{padding:16px}
.tot{display:flex;justify-content:space-between;padding:4px 0;font-size:.92rem}
.tot.big{font-weight:700;border-top:1px solid var(--line);margin-top:6px;padding-top:8px}
.hist{font-size:.82rem;color:var(--muted);margin:0;padding-left:18px}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.steps .btn.cur{background:var(--ok);color:#fff}
.muted{color:var(--muted)}.small{font-size:.85rem}
.login{max-width:380px;margin:12vh auto;padding:0 16px}
.demo{background:var(--gold-soft);color:var(--gold);font-size:.82rem;text-align:center;padding:6px 12px}
.empty{text-align:center;color:var(--muted);padding:40px}
.preview{width:120px;height:120px;border-radius:12px;object-fit:cover;background:var(--surface2);border:1px solid var(--line)}
.chk{display:flex;gap:8px;align-items:center;margin-top:12px;font-size:.9rem}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--ink-text);padding:10px 16px;border-radius:999px;opacity:0;transition:.25s;pointer-events:none;z-index:99}
#toast.show{opacity:1}
[hidden]{display:none!important}
.cprow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
html,body{overflow-x:hidden}
.stock input.price{width:100px}
.prod{grid-template-columns:56px 1fr}
.prod>div:last-child{grid-column:1/-1;flex-wrap:wrap;justify-content:flex-end}
@media(min-width:800px){.prod{grid-template-columns:56px 1fr auto}.prod>div:last-child{grid-column:auto}}
.posl{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
table.t{width:100%;border-collapse:collapse;font-size:.85rem}
table.t td{padding:6px 4px;border-bottom:1px solid var(--line);vertical-align:top}
</style>
</head>
<body>
<div id="demoBar" class="demo" hidden>Mode démonstration — les données sont stockées dans ce navigateur. Ouvrez la boutique dans un autre onglet pour voir les changements en direct.</div>

<section id="login" class="login" hidden>
  <div class="box">
    <div class="logo" style="margin-bottom:12px"><b>AC</b>Administration</div>
    <form id="lform">
      <div id="lmailBox" hidden><label class="f" for="lmail">E-mail du compte</label><input class="in" id="lmail" type="email" autocomplete="username"></div>
      <label class="f" for="lpass">Mot de passe administrateur</label><input class="in" id="lpass" type="password" autocomplete="current-password" required>
      <button class="btn" style="width:100%;margin-top:14px">Se connecter</button>
      <p class="small" style="margin:10px 0 0"><a href="#" id="lother">Autre compte administrateur</a></p>
      <p id="lerr" class="small" style="color:var(--danger)"></p>
    </form>
  </div>
</section>

<div id="adm" hidden>
  <header><div class="wrap">
    <div class="logo"><b>AC</b><span>Admin</span></div>
    <nav class="tabs" id="tabs">
      <button data-t="dash" class="on">Tableau de bord</button>
      <button data-t="orders">Commandes<span class="cnt" id="todo" hidden></span></button>
      <button data-t="products">Produits</button>
      <button data-t="promos">Promotions & prix</button>
      <button data-t="pos">Vente comptoir</button>
      <button data-t="site">Contenu du site</button>
      <button data-t="settings">Réglages</button>
    </nav>
    <a class="btn ghost sm" href="index.html" target="_blank">Voir la boutique</a>
    <button class="btn ghost sm" id="logout">Déconnexion</button>
  </div></header>
  <main class="wrap" id="view"></main>
</div>

<dialog id="dlg"><div class="dh"><b id="dlgT"></b><button class="btn ghost sm" id="dlgX">Fermer</button></div><div class="db" id="dlgB"></div></dialog>
<div id="toast" role="status"></div>

<script src="config.js"></script>
<script src="demo-data.js"></script>
<script>
(function () {
'use strict';
var C = window.AC_CONFIG || {}, STORE = C.store || {};
var DEMO = !(C.firebase && C.firebase.projectId);
var FBV = '10.14.1';
var $ = function (s, r) { return (r || document).querySelector(s); };
var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
var LS = { get: function (k, d) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }, set: function (k, v) { localStorage.setItem(k, JSON.stringify(v)); } };
function loadScript(src) { return new Promise(function (res, rej) { var s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); }); }
var tt; function toast(m) { var t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(tt); tt = setTimeout(function () { t.classList.remove('show'); }, 2600); }
function fcfa(x) { return new Intl.NumberFormat('fr-FR').format(Math.round(+x || 0)) + '\u00a0FCFA'; }
function fmtDate(t) { try { return new Date(t).toLocaleString('fr-FR', { dateStyle: 'short', timeStyle: 'short', timeZone: 'Africa/Bamako' }); } catch (e) { return new Date(t).toLocaleString('fr-FR'); } }
function digits(s) { return String(s || '').replace(/\D/g, ''); }
function sha256(t) { return crypto.subtle.digest('SHA-256', new TextEncoder().encode(t)).then(function (b) { return Array.prototype.map.call(new Uint8Array(b), function (x) { return ('0' + x.toString(16)).slice(-2); }).join(''); }); }
function demoHash() { return LS.get('ac_demo_pass', null) || C.demoPasswordHash || ''; }
function promoOn(p) { return +p.promoPrice > 0 && +p.promoPrice < +p.price && (!+p.promoEnd || +p.promoEnd > Date.now()); }
function eff(p) { return promoOn(p) ? +p.promoPrice : +p.price; }
function dtl(ms) { if (!+ms) return ''; var d = new Date(+ms), z = function (n) { return ('0' + n).slice(-2); }; return d.getFullYear() + '-' + z(d.getMonth() + 1) + '-' + z(d.getDate()) + 'T' + z(d.getHours()) + ':' + z(d.getMinutes()); }
function fromDtl(v) { return v ? new Date(v).getTime() : 0; }
function newCode() { var a = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789', o = '', r = new Uint32Array(8); crypto.getRandomValues(r); for (var i = 0; i < 8; i++) o += a[r[i] % a.length]; return 'AC-' + o; }
function slug(s) { return String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 60) || 'produit'; }

var CATS = { smartphones: 'Smartphones', ordinateurs: 'Ordinateurs', audio: 'Audio', connectes: 'Objets connectés', gadgets: 'Gadgets', composants: 'Composants' };
var ST = { recue: 'Reçue', confirmee: 'Confirmée', preparation: 'En préparation', prete: 'Prête au retrait', expediee: 'Expédiée / en livraison', livree: 'Livrée', retiree: 'Retirée', annulee: 'Annulée' };
var STC = { recue: 'gold', confirmee: 'warn', preparation: 'warn', prete: 'ok', expediee: 'ok', livree: 'ok', retiree: 'ok', annulee: 'bad' };
var FLOW = { collect: ['recue', 'confirmee', 'preparation', 'prete', 'retiree'], delivery: ['recue', 'confirmee', 'preparation', 'expediee', 'livree'], relay: ['recue', 'confirmee', 'preparation', 'expediee', 'livree'], intl: ['recue', 'confirmee', 'preparation', 'expediee', 'livree'] };
var MODE = { delivery: 'Livraison Bamako', collect: 'Click & Collect', relay: 'Point relais', intl: 'International' };
var PAYM = { cash: 'Espèces', om: 'Orange Money', moov: 'Moov Money', card: 'Carte bancaire', paypal: 'PayPal' };
var PST = { paye: ['ok', 'Payé'], a_verifier: ['warn', 'À vérifier'], non_paye: ['', 'Non payé'], en_attente_paypal: ['warn', 'Attente PayPal'], rembourse: ['bad', 'Remboursé'] };
var FINAL = ['livree', 'retiree', 'annulee'];
function pill(cls, txt) { return '<span class="pill ' + cls + '">' + esc(txt) + '</span>'; }
function stPill(s) { return pill(STC[s] || '', ST[s] || s); }
function payPill(s) { var p = PST[s] || ['', s]; return pill(p[0], p[1]); }

/* ============ Couche données ============ */
function demoCoupons() {
  var m = LS.get('ac_demo_coupons', null);
  if (!m) { m = {}; (window.AC_SEED_COUPONS || []).forEach(function (c) { m[c.code] = c; }); LS.set('ac_demo_coupons', m); }
  return m;
}
var db = null, auth = null, me = { email: 'demo' };
var D = { orders: [], products: [], settings: Object.assign({}, C.defaults), site: {}, coupons: [] };
var ADB = {
  init: function () {
    if (DEMO) return Promise.resolve();
    var b = 'https://www.gstatic.com/firebasejs/' + FBV + '/';
    return loadScript(b + 'firebase-app-compat.js').then(function () { return Promise.all([loadScript(b + 'firebase-firestore-compat.js'), loadScript(b + 'firebase-auth-compat.js')]); })
      .then(function () { firebase.initializeApp(C.firebase); db = firebase.firestore(); auth = firebase.auth(); });
  },
  log: function (action, target, detail) {
    var e = { at: Date.now(), by: me.email, action: action, target: target || '', detail: detail || '' };
    if (DEMO) { var a = LS.get('ac_demo_audit', []); a.unshift(e); LS.set('ac_demo_audit', a.slice(0, 300)); return Promise.resolve(); }
    return db.collection('auditLog').add(e).catch(function (x) { console.warn(x); });
  },
  watch: function () {
    if (DEMO) {
      var load = function () {
        var o = LS.get('ac_demo_orders', {});
        D.orders = Object.keys(o).map(function (k) { return o[k]; }).sort(function (a, b) { return b.createdAt - a.createdAt; });
        D.products = LS.get('ac_demo_products', null) || (window.AC_SEED || []).slice();
        D.settings = Object.assign({}, C.defaults, LS.get('ac_demo_settings', {}));
        D.site = LS.get('ac_demo_site', {});
        D.coupons = Object.keys(demoCoupons()).map(function (k) { return demoCoupons()[k]; });
        render();
      };
      load(); addEventListener('storage', load); return;
    }
    db.collection('orders').orderBy('createdAt', 'desc').limit(300).onSnapshot(function (s) {
      var first = D.orders.length === 0;
      var before = {}; D.orders.forEach(function (o) { before[o.code] = 1; });
      D.orders = s.docs.map(function (d) { return d.data(); });
      if (!first && D.orders.some(function (o) { return !before[o.code]; })) { toast('Nouvelle commande reçue'); try { navigator.vibrate && navigator.vibrate(200); } catch (e) {} }
      render();
    }, function (e) { toast('Erreur commandes : ' + e.message); });
    db.collection('products').onSnapshot(function (s) { D.products = s.docs.map(function (d) { var o = d.data(); o.id = d.id; return o; }); render(); });
    db.doc('settings/store').onSnapshot(function (d) { D.settings = Object.assign({}, C.defaults, d.exists ? d.data() : {}); if (cur === 'settings' && !$('#setForm')) render(); });
    db.collection('coupons').onSnapshot(function (q) { D.coupons = q.docs.map(function (d) { return d.data(); }); render(); }, function (e) { console.warn(e); });
    db.doc('settings/site').onSnapshot(function (d) { D.site = d.exists ? d.data() : {}; if (cur === 'site' && !$('#siteForm')) render(); });
  },
  updateOrder: function (o, patch, action, detail) {
    if (DEMO) { var all = LS.get('ac_demo_orders', {}); Object.assign(all[o.code], patch); LS.set('ac_demo_orders', all); Object.assign(o, patch); }
    var p = DEMO ? Promise.resolve() : db.collection('orders').doc(o.code).update(patch).then(function () { Object.assign(o, patch); });
    return p.then(function () { return ADB.log(action, o.code, detail); }).then(function () { if (DEMO) { D.orders = D.orders.slice(); render(); } });
  },
  cancelOrder: function (o) {
    var hist = (o.history || []).concat({ s: 'annulee', at: Date.now(), by: me.email });
    if (DEMO) {
      var ps = LS.get('ac_demo_products', []);
      o.items.forEach(function (it) { var p = ps.filter(function (x) { return x.id === it.id; })[0]; if (p) p.stock = (+p.stock || 0) + it.qty; });
      LS.set('ac_demo_products', ps); D.products = ps;
      return ADB.updateOrder(o, { status: 'annulee', history: hist }, 'annulation', 'Remise en stock de ' + o.items.length + ' article(s)');
    }
    return db.runTransaction(function (t) {
      var refs = o.items.map(function (i) { return db.collection('products').doc(i.id); });
      return Promise.all(refs.map(function (r) { return t.get(r); })).then(function (snaps) {
        snaps.forEach(function (s, k) { if (s.exists) t.update(refs[k], { stock: (+s.data().stock || 0) + o.items[k].qty }); });
        t.update(db.collection('orders').doc(o.code), { status: 'annulee', history: hist });
      });
    }).then(function () { Object.assign(o, { status: 'annulee', history: hist }); return ADB.log('annulation', o.code, 'Remise en stock'); });
  },
  saveProduct: function (p, full, isNew) {
    if (DEMO) {
      var ps = LS.get('ac_demo_products', null) || (window.AC_SEED || []).slice();
      var i = ps.findIndex(function (x) { return x.id === p.id; }); if (i >= 0) ps[i] = p; else ps.push(p);
      try { LS.set('ac_demo_products', ps); if (full) LS.set('ac_demo_img_' + p.id, full); } catch (e) { return Promise.reject(new Error('Stockage du navigateur plein (mode démo) : utilisez des images plus légères.')); }
      D.products = ps;
    }
    var id = p.id, data = Object.assign({}, p); delete data.id;
    var w = DEMO ? Promise.resolve() : db.collection('products').doc(id).set(data).then(function () { return full ? db.collection('productImages').doc(id).set({ full: full }) : null; });
    return w.then(function () { return ADB.log(isNew ? 'produit_cree' : 'produit_modifie', id, p.name + ' · ' + fcfa(p.price) + ' · stock ' + p.stock); }).then(function () { if (DEMO) render(); });
  },
  deleteProduct: function (p) {
    if (DEMO) { LS.set('ac_demo_products', LS.get('ac_demo_products', []).filter(function (x) { return x.id !== p.id; })); try { localStorage.removeItem('ac_demo_img_' + p.id); } catch (e) {} D.products = LS.get('ac_demo_products', []); }
    var w = DEMO ? Promise.resolve() : db.collection('products').doc(p.id).delete().then(function () { return db.collection('productImages').doc(p.id).delete(); });
    return w.then(function () { return ADB.log('produit_supprime', p.id, p.name); }).then(function () { if (DEMO) render(); });
  },
  setPrice: function (p, n) {
    var old = p.price;
    if (DEMO) { var ps = LS.get('ac_demo_products', []); var x = ps.filter(function (y) { return y.id === p.id; })[0]; if (x) x.price = n; LS.set('ac_demo_products', ps); D.products = ps; }
    var w = DEMO ? Promise.resolve() : db.collection('products').doc(p.id).update({ price: n });
    return w.then(function () { return ADB.log('prix', p.id, p.name + ' : ' + fcfa(old) + ' → ' + fcfa(n)); });
  },
  bulk: function (list, action, detail) {
    if (!list.length) return Promise.resolve();
    if (DEMO) {
      var ps = LS.get('ac_demo_products', null) || (window.AC_SEED || []).slice();
      list.forEach(function (u) { var x = ps.filter(function (y) { return y.id === u.id; })[0]; if (x) Object.assign(x, u.patch); });
      LS.set('ac_demo_products', ps); D.products = ps;
      return ADB.log(action, 'products', detail).then(render);
    }
    var chunks = []; for (var i = 0; i < list.length; i += 400) chunks.push(list.slice(i, i + 400));
    return Promise.all(chunks.map(function (ch) { var b = db.batch(); ch.forEach(function (u) { b.update(db.collection('products').doc(u.id), u.patch); }); return b.commit(); }))
      .then(function () { return ADB.log(action, 'products', detail); });
  },
  saveCoupon: function (c, isNew) {
    if (DEMO) { var m = demoCoupons(); m[c.code] = c; LS.set('ac_demo_coupons', m); D.coupons = Object.keys(m).map(function (k) { return m[k]; }); }
    var w = DEMO ? Promise.resolve() : db.collection('coupons').doc(c.code).set(c);
    return w.then(function () { return ADB.log(isNew ? 'code_promo_cree' : 'code_promo_modifie', c.code, (c.type === 'pct' ? c.value + ' %' : fcfa(c.value)) + (c.active ? '' : ' (désactivé)')); }).then(function () { if (DEMO) render(); });
  },
  deleteCoupon: function (code) {
    if (DEMO) { var m = demoCoupons(); delete m[code]; LS.set('ac_demo_coupons', m); D.coupons = Object.keys(m).map(function (k) { return m[k]; }); }
    var w = DEMO ? Promise.resolve() : db.collection('coupons').doc(code).delete();
    return w.then(function () { return ADB.log('code_promo_supprime', code, ''); }).then(function () { if (DEMO) render(); });
  },
  posSale: function (order) {
    if (DEMO) {
      var ps = LS.get('ac_demo_products', []);
      for (var i = 0; i < order.items.length; i++) { var it = order.items[i], x = ps.filter(function (y) { return y.id === it.id; })[0]; if (!x || (+x.stock || 0) < it.qty) return Promise.reject(new Error('Stock insuffisant : ' + it.name)); }
      order.items.forEach(function (it) { var x = ps.filter(function (y) { return y.id === it.id; })[0]; x.stock = (+x.stock || 0) - it.qty; });
      LS.set('ac_demo_products', ps); D.products = ps;
      var all = LS.get('ac_demo_orders', {}); all[order.code] = order; LS.set('ac_demo_orders', all);
      D.orders = [order].concat(D.orders);
      return ADB.log('vente_comptoir', order.code, fcfa(order.total) + ' · ' + PAYM[order.payment.method]);
    }
    return db.runTransaction(function (t) {
      var refs = order.items.map(function (i) { return db.collection('products').doc(i.id); });
      return Promise.all(refs.map(function (r) { return t.get(r); })).then(function (snaps) {
        snaps.forEach(function (sn, k) { if (!sn.exists || (+sn.data().stock || 0) < order.items[k].qty) throw new Error('Stock insuffisant : ' + order.items[k].name); });
        snaps.forEach(function (sn, k) { t.update(refs[k], { stock: (+sn.data().stock || 0) - order.items[k].qty }); });
        t.set(db.collection('orders').doc(order.code), order);
      });
    }).then(function () { return ADB.log('vente_comptoir', order.code, fcfa(order.total) + ' · ' + PAYM[order.payment.method]); });
  },
  setStock: function (p, n) {
    var old = p.stock;
    if (DEMO) { var ps = LS.get('ac_demo_products', []); var x = ps.filter(function (y) { return y.id === p.id; })[0]; if (x) x.stock = n; LS.set('ac_demo_products', ps); D.products = ps; }
    var w = DEMO ? Promise.resolve() : db.collection('products').doc(p.id).update({ stock: n });
    return w.then(function () { return ADB.log('stock', p.id, p.name + ' : ' + old + ' → ' + n); });
  },
  saveSettings: function (s) {
    if (DEMO) { LS.set('ac_demo_settings', s); D.settings = Object.assign({}, C.defaults, s); }
    var w = DEMO ? Promise.resolve() : db.doc('settings/store').set(s);
    return w.then(function () { return ADB.log('reglages', 'settings/store', 'Mise à jour des tarifs'); });
  },
  saveSite: function (site) {
    if (DEMO) { LS.set('ac_demo_site', site); D.site = site; }
    var w = DEMO ? Promise.resolve() : db.doc('settings/site').set(site);
    return w.then(function () { return ADB.log('contenu_site', 'settings/site', 'Mise à jour du contenu du site'); });
  },
  changePassword: function (oldP, newP) {
    if (DEMO) return sha256(oldP).then(function (h) { if (h !== demoHash()) throw new Error('Mot de passe actuel incorrect'); return sha256(newP); })
      .then(function (h) { LS.set('ac_demo_pass', h); try { sessionStorage.setItem('ac_demo_admin', h); } catch (e) {} return ADB.log('mot_de_passe', 'admin', 'Mot de passe modifié'); });
    var u = auth.currentUser;
    return u.reauthenticateWithCredential(firebase.auth.EmailAuthProvider.credential(u.email, oldP))
      .catch(function () { throw new Error('Mot de passe actuel incorrect'); })
      .then(function () { return u.updatePassword(newP); })
      .then(function () { return ADB.log('mot_de_passe', u.email, 'Mot de passe modifié'); });
  },
  audit: function () {
    if (DEMO) return Promise.resolve(LS.get('ac_demo_audit', []).slice(0, 60));
    return db.collection('auditLog').orderBy('at', 'desc').limit(60).get().then(function (s) { return s.docs.map(function (d) { return d.data(); }); });
  },
  importSeed: function () {
    var seed = window.AC_SEED || [];
    if (DEMO) { LS.set('ac_demo_products', seed.slice()); D.products = seed.slice(); render(); return Promise.resolve(); }
    var b = db.batch(); seed.forEach(function (p) { var d = Object.assign({}, p); delete d.id; b.set(db.collection('products').doc(p.id), d); });
    return b.commit().then(function () { return ADB.log('import_demo', 'products', seed.length + ' produits'); });
  }
};

function compress(file, max, q) {
  return new Promise(function (res, rej) {
    var im = new Image();
    im.onload = function () {
      var k = Math.min(1, max / Math.max(im.width, im.height)), c = document.createElement('canvas');
      c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
      var x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(im, 0, 0, c.width, c.height);
      var u = c.toDataURL('image/webp', q); if (u.indexOf('data:image/webp') !== 0) u = c.toDataURL('image/jpeg', q);
      URL.revokeObjectURL(im.src); res(u);
    };
    im.onerror = rej; im.src = URL.createObjectURL(file);
  });
}

document.addEventListener('click', function (e) {

  if (t.id === 'prApply' || t.id === 'prClear') {

  if (t.id === 'bpApply') {
    var bc = $('#bpCat').value, bl = inCat(bc), v = parseFloat($('#bpPct').value);
    if (!v || v <= -90 || v > 300) { toast('Variation invalide'); return; }
    if (!confirm((v > 0 ? 'Augmenter' : 'Baisser') + ' de ' + Math.abs(v) + ' % le prix de ' + bl.length + ' produit(s) (' + (bc ? CATS[bc] : 'tout le catalogue') + ') ?')) return;
    ADB.bulk(bl.map(function (p) { return { id: p.id, patch: { price: Math.max(100, Math.round(p.price * (1 + v / 100) / 100) * 100) } }; }), 'prix_masse', (v > 0 ? '+' : '') + v + ' % · ' + (bc ? CATS[bc] : 'tout le catalogue'))
      .then(function () { toast('Prix mis à jour'); }).catch(err);
    return;
  }
  if (t.dataset.prstop) { var sp = D.products.filter(function (x) { return x.id === t.dataset.prstop; })[0]; if (sp) ADB.bulk([{ id: sp.id, patch: { promoPrice: 0, promoEnd: 0 } }], 'promo_retiree', sp.name).then(function () { toast('Promotion arrêtée'); }).catch(err); return; }
  if (t.dataset.cptoggle) { var c0 = D.coupons.filter(function (x) { return x.code === t.dataset.cptoggle; })[0]; if (c0) ADB.saveCoupon(Object.assign({}, c0, { active: c0.active === false }), false).then(function () { toast('Code mis à jour'); }).catch(err); return; }
  if (t.dataset.cpdel) { if (confirm('Supprimer le code ' + t.dataset.cpdel + ' ?')) ADB.deleteCoupon(t.dataset.cpdel).then(function () { toast('Code supprimé'); }).catch(err); return; }
  if (t.id === 'posAdd') {
    var pp = D.products.filter(function (x) { return x.id === $('#posSel').value; })[0], q = parseInt($('#posQty').value, 10) || 1;
    if (!pp) { toast('Choisissez un produit'); return; }
    var ex = pos.lines.filter(function (l) { return l.id === pp.id; })[0], tq = (ex ? ex.qty : 0) + q;
    if (tq > (+pp.stock || 0)) { toast('Stock disponible : ' + pp.stock); return; }
    if (ex) ex.qty = tq; else pos.lines.push({ id: pp.id, name: pp.name, price: eff(pp), qty: q });
    $('#posQty').value = 1; renderPos(); return;
  }
  if (t.dataset.posrm) { pos.lines.splice(+t.dataset.posrm, 1); renderPos(); return; }
  if (t.id === 'posSave') {
    if (!pos.lines.length) { toast('Ajoutez au moins un article'); return; }
    var pay = ($('input[name=posPay]:checked') || {}).value || 'cash', ref = $('#posRef').value.trim();
    if ((pay === 'om' || pay === 'moov') && ref.length < 4) { toast('Saisissez la référence de la transaction ' + PAYM[pay]); return; }
    var sub = posSum(), dsc = Math.min(Math.max(0, parseInt($('#posDisc').value, 10) || 0), sub), now = Date.now();
    var order = { code: newCode(), createdAt: now, channel: 'comptoir', status: 'retiree', history: [{ s: 'retiree', at: now, by: me.email }],
      items: pos.lines.map(function (l) { return { id: l.id, name: l.name, price: l.price, qty: l.qty }; }),
      subtotal: sub, discount: dsc, coupon: '', shipping: 0, total: sub - dsc, currency: 'XOF', displayTotal: sub - dsc,
      customer: { name: $('#posName').value.trim() || 'Client comptoir', phone: $('#posPhone').value.trim(), email: '' },
      delivery: { mode: 'collect', zone: 'Vente au comptoir', address: '', city: 'Bamako', country: 'Mali', postal: '' },
      note: '', payment: { method: pay, ref: ref }, paymentStatus: 'paye', tracking: { carrier: '', number: '' } };
    t.disabled = true;
    ADB.posSale(order).then(function () { toast('Vente enregistrée : ' + order.code + ' · ' + fcfa(order.total)); pos.lines = []; $('#view').innerHTML = ''; render(); })
      .catch(function (x) { t.disabled = false; err(x); });
    return;
  }
  if (t.dataset.t) { cur = t.dataset.t; $('#view').innerHTML = ''; render(); return; }
  if (t.dataset.o) { e.preventDefault(); orderDetail(t.dataset.o); return; }
  if (t.dataset.edit) { productForm(t.dataset.edit); return; }
  if (t.id === 'newP') { productForm(null); return; }
  if (t.id === 'dlgX') { closeDlg(); return; }
  if (t.id === 'csvBtn') { csv(); return; }
  if (t.id === 'seedBtn') { t.disabled = true; ADB.importSeed().then(function () { toast('Catalogue de démonstration importé'); }).catch(function (x) { toast(x.message); t.disabled = false; }); return; }
  if (t.id === 'logout') { if (DEMO) { try { sessionStorage.removeItem('ac_demo_admin'); } catch (x) {} location.reload(); return; } auth.signOut().then(function () { location.reload(); }); return; }
  var a = t.dataset.act, o = t.dataset.c ? findOrder(t.dataset.c) : null, done = function (m) { return function () { toast(m); if (o) orderDetail(o.code); }; }, fail = function (x) { toast('Erreur : ' + x.message); };
  if (a === 'st' && o) { var hist = (o.history || []).concat({ s: t.dataset.s, at: Date.now(), by: me.email }); ADB.updateOrder(o, { status: t.dataset.s, history: hist }, 'statut', ST[o.status] + ' → ' + ST[t.dataset.s]).then(done('Statut mis à jour')).catch(fail); }
  if (a === 'pay' && o) { var ps = $('#payS').value; ADB.updateOrder(o, { paymentStatus: ps }, 'paiement', (PST[o.paymentStatus] || [, o.paymentStatus])[1] + ' → ' + PST[ps][1]).then(done('Paiement mis à jour')).catch(fail); }
  if (a === 'trk' && o) { var tr = { carrier: $('#trC').value.trim(), number: $('#trN').value.trim() }; ADB.updateOrder(o, { tracking: tr }, 'suivi', tr.carrier + ' ' + tr.number).then(done('Suivi enregistré')).catch(fail); }
  if (a === 'cancel' && o) { if (confirm('Annuler la commande ' + o.code + ' et remettre les articles en stock ?')) ADB.cancelOrder(o).then(done('Commande annulée, stock remis')).catch(fail); }
  if (a === 'del') { var p = D.products.filter(function (x) { return x.id === t.dataset.id; })[0]; if (p && confirm('Supprimer définitivement « ' + p.name + ' » ? (Conseil : décochez plutôt « Visible ».)')) ADB.deleteProduct(p).then(function () { toast('Produit supprimé'); closeDlg(); }).catch(fail); }
});
document.addEventListener('input', function (e) {
  if (e.target.id === 'oq') { oFilter.q = e.target.value; renderOrders(); }
  if (e.target.id === 'pq') { pFilter = e.target.value; renderProducts(); }
  if (e.target.id === 'posDisc') posTot();
});
document.addEventListener('change', function (e) {
  if (e.target.id === 'ost') { oFilter.st = e.target.value; renderOrders(); }
  if (e.target.name === 'posPay') { pos.pay = e.target.value; }
  if (e.target.dataset.price) {
    var pr = D.products.filter(function (x) { return x.id === e.target.dataset.price; })[0], np = parseInt(e.target.value, 10);
    if (!pr || !(np > 0)) { toast('Prix invalide'); return; }
    if (np === +pr.price) return;
    ADB.setPrice(pr, np).then(function () { toast('Prix mis à jour : ' + pr.name + ' → ' + fcfa(np)); if (DEMO) renderProducts(); }).catch(function (x) { toast('Erreur : ' + x.message); });
  }
  if (e.target.dataset.stock) {
    var p = D.products.filter(function (x) { return x.id === e.target.dataset.stock; })[0], n = parseInt(e.target.value, 10);
    if (!p || isNaN(n) || n < 0) { toast('Stock invalide'); return; }
    ADB.setStock(p, n).then(function () { toast('Stock mis à jour : ' + p.name + ' → ' + n); if (DEMO) renderProducts(); }).catch(function (x) { toast('Erreur : ' + x.message); });
  }
});
document.addEventListener('submit', function (e) {
  if (e.target.id === 'cpForm') {
    e.preventDefault();
    var code = $('#cpCode').value.trim().toUpperCase().replace(/\s/g, ''), type = $('#cpType').value, val = parseInt($('#cpVal').value, 10);
    if (!/^[A-Z0-9_-]{3,20}$/.test(code)) { toast('Code : 3 à 20 lettres ou chiffres, sans espace'); return; }
    if (!(val > 0) || (type === 'pct' && val > 90)) { toast(type === 'pct' ? 'Pourcentage entre 1 et 90' : 'Montant invalide'); return; }
    var exists = D.coupons.some(function (c) { return c.code === code; });
    if (exists && !confirm('Le code ' + code + ' existe déjà. Le remplacer ?')) return;
    var old = D.coupons.filter(function (c) { return c.code === code; })[0];
    ADB.saveCoupon({ code: code, type: type, value: val, min: parseInt($('#cpMin').value, 10) || 0, end: fromDtl($('#cpEnd').value), maxUses: parseInt($('#cpMax').value, 10) || 0, used: old ? (+old.used || 0) : 0, active: true }, !exists)
      .then(function () { toast('Code promo ' + code + ' créé'); e.target.reset(); }).catch(function (x) { toast('Erreur : ' + x.message); });
    return;
  }
  if (e.target.id === 'siteForm') {
    e.preventDefault(); var r = collectSite(); if (r.err) { toast(r.err); return; }
    ADB.saveSite(r.site).then(function () { toast('Contenu du site enregistré — en ligne'); }).catch(function (x) { toast('Erreur : ' + x.message); });
    return;
  }
  if (e.target.id === 'pwForm') {
    e.preventDefault(); var o = $('#pwOld').value, n = $('#pwNew').value;
    if (n.length < 8) { toast('Le nouveau mot de passe doit faire au moins 8 caractères'); return; }
    if (n !== $('#pwNew2').value) { toast('La confirmation ne correspond pas'); return; }
    ADB.changePassword(o, n).then(function () { toast('Mot de passe modifié'); e.target.reset(); }).catch(function (x) { toast(/recent|requires-recent/.test(x.code || '') ? 'Reconnectez-vous puis réessayez' : x.message); });
    return;
  }
  if (e.target.id !== 'setForm') return; e.preventDefault();
  var s = { usdRate: parseFloat($('#sUsd').value) || 600, freeFrom: parseInt($('#sFree').value, 10) || 0, zones: parseLines($('#sZones').value), relays: parseLines($('#sRelays').value), intlZones: parseLines($('#sIntl').value) };
  if (!s.zones.length) { toast('Au moins un quartier est requis'); return; }
  ADB.saveSettings(s).then(function () { toast('Réglages enregistrés'); $('#view').innerHTML = ''; render(); }).catch(function (x) { toast('Erreur : ' + x.message); });
});

/* ============ Démarrage ============ */
function start() { $('#login').hidden = true; $('#adm').hidden = false; ADB.watch(); render(); }
function showLogin() { $('#adm').hidden = true; $('#login').hidden = false; setTimeout(function () { $('#lpass').focus(); }, 50); }
$('#lmail').value = C.adminEmail || '';
if (!C.adminEmail) $('#lmailBox').hidden = false;
$('#lother').onclick = function (e) { e.preventDefault(); $('#lmailBox').hidden = false; $('#lmail').focus(); };
ADB.init().then(function () {
  if (DEMO) {
    $('#demoBar').hidden = false; $('#lother').hidden = true;
    var ok = false; try { ok = sessionStorage.getItem('ac_demo_admin') === demoHash(); } catch (e) {}
    if (ok) start(); else showLogin();
    $('#lform').onsubmit = function (e) {
      e.preventDefault();
      sha256($('#lpass').value).then(function (h) {
        if (h !== demoHash()) { $('#lerr').textContent = 'Mot de passe incorrect.'; return; }
        try { sessionStorage.setItem('ac_demo_admin', h); } catch (x) {}
        $('#lerr').textContent = ''; ADB.log('connexion', 'admin', 'Connexion (démo)'); start();
      });
    };
    return;
  }
  auth.onAuthStateChanged(function (u) {
    if (!u) { showLogin(); return; }
    db.doc('admins/' + u.uid).get().then(function (d) {
      if (!d.exists) { $('#lerr').textContent = 'Ce compte n’est pas autorisé (UID : ' + u.uid + '). Ajoutez-le dans la collection « admins ».'; auth.signOut(); return; }
      me = { email: u.email, uid: u.uid }; start();
    }).catch(function (e) { $('#lerr').textContent = 'Accès refusé : ' + e.message; showLogin(); });
  });
  $('#lform').onsubmit = function (e) {
    e.preventDefault(); $('#lerr').textContent = '';
    var mail = ($('#lmail').value || C.adminEmail || '').trim();
    if (!mail) { $('#lmailBox').hidden = false; $('#lerr').textContent = 'Indiquez l’e-mail du compte.'; return; }
    auth.signInWithEmailAndPassword(mail, $('#lpass').value).catch(function (x) {
      $('#lerr').textContent = /invalid|wrong|not-found|credential/i.test(x.code || '') ? 'Mot de passe incorrect.' : /too-many/.test(x.code || '') ? 'Trop de tentatives, réessayez plus tard.' : x.message;
    });
  };
}).catch(function () { document.body.innerHTML = '<p style="padding:30px">Impossible de charger Firebase. Vérifiez votre connexion et config.js.</p>'; });
})();
</script>
</body>
